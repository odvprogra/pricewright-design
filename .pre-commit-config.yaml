# Formatting and Markdown run through `just lint` (the versions in pnpm-lock.yaml, exactly what CI
# runs); the hooks guard what every commit must never carry.
default_install_hook_types: [pre-commit, commit-msg]
# Third-party fonts and their licenses stay byte for byte as published.
exclude: ^assets/fonts/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents] # pnpm-lock.yaml holds more than one
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        # Generated from pricewright-api by `just demo-data`, regenerated rather than edited.
        exclude: ^(prototype/data/demo\.json|tests/fixtures/engine-prices\.json)$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
