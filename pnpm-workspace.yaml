# pnpm settings (a single package, no workspace members).

# Patched versions of the linters' transitive dependencies, until markdownlint-cli2 requires them.
overrides:
  katex: 0.18.11 # GHSA-238p-pmpm-9mq7; markdownlint parses math with it, this repo has none
  re2js: 2.8.8 # GHSA-gg6h-894w-4m9c; markdownlint 0.42.0 pins 2.8.6, the advisory's fix is 2.8.7

auditConfig:
  ignoreGhsas:
    # braces <= 3.0.3 has no patched version yet. Only markdownlint-cli2's globs reach it, and they
    # come from this repository's own configuration, never from outside input. Remove when fixed.
    - GHSA-vfj7-8cjw-p6xm
    # deepmerge <= 4.3.1 has no patched version yet. Style Dictionary merges this repository's own
    # token files and configuration with it, never outside input. Remove when fixed.
    - GHSA-gcqx-w48m-w2h4
